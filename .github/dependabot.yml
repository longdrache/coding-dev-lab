# Security-only mode: NO version-update entries on purpose. Dependabot then
# opens PRs only for CVEs (repo Settings → Code security → Dependabot security
# updates, already enabled) instead of bumping every package weekly.
#
# The `github-actions` entry below is the exception: Actions have no
# security-update channel, so without it CI actions (checkout, trivy-action,
# …) would rot forever. Weekly, capped, labelled `type/ci` — cheap to review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["type/ci"]
