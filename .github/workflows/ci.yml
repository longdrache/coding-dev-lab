name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: FE/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Trước đây job này không chạy test, nên 79 unit test của FE chưa bao giờ
      # được canh trong CI.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Next 16 sinh kiểu `LayoutProps`/`PageProps` vào `.next/types/`. Checkout
      # sạch chưa có thư mục này nên `tsc` sẽ báo TS2304 nếu typecheck chạy trước.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    # e2e cần Postgres that. Khong dung Neon production: test ghi vao DB that.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gocode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gocode_test
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: be/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      # `test:cov` chính là `test` cộng thêm đo coverage — thay chứ không thêm một
      # lần chạy nữa, nên ngưỡng trong `vitest.config.ts` được canh thật mà CI không
      # chậm thêm. Xem `be/vitest.config.ts` (thresholds lines 80 / branches 75).
      - name: Test
        run: pnpm test:cov

      # e2e: migration nen tao du 13 bang, can seed de co du lieu de test.
      # Spec tu sinh cap khoa RSA nen khong can ADMIN_JWT_* o day.
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed problems
        run: node scripts/seed-problems.ts

      - name: Test (e2e)
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # Job 6: Telegram Notification
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: [frontend, admin, backend]
    if: always()

    steps:
      - name: Check results
        id: check
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
           [ "${{ needs.admin.result }}" != "success" ] || \
           [ "${{ needs.backend.result }}" != "success" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Send Success Message
        if: steps.check.outputs.status == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="✅ CI/CD SUCCESS%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0AAuthor: ${{ github.actor }}%0ALink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Failure Message
        if: steps.check.outputs.status == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="❌ CI/CD FAILED%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0AAuthor: ${{ github.actor }}%0ALink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
