# =============================================================================
# GoCode CI
#
# What runs here (all jobs in parallel unless noted):
#   frontend   — Next.js app:      lint + typecheck + unit tests + build
#   admin      — Admin dashboard:  typegen + lint + typecheck + build
#   backend    — NestJS API:       lint + unit (coverage gates) + migrations +
#                                  seeds + API e2e + DB/SMTP integration + build
#   playwright — Browser e2e:      real FE + real BE + Postgres + Judge0
#   notify     — Telegram summary of the four jobs above (always runs)
#
# Required repository secrets (Settings → Secrets → Actions):
#   JUDGE0_URL, JUDGE0_API_TOKEN       — real Judge0 for the submit test
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — build notifications
#
# Conventions used in this file:
# - Shared constants live in top-level `env:`; per-job values stay on the job.
# - Every job has `timeout-minutes` so a hung step fails loudly instead of
#   burning the 6h runner default.
# - Comments explain WHY a step exists, never WHAT the command does.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# A newer push supersedes older runs on the same branch/PR instead of queueing
# behind them. Main-branch runs are also cancelled: nothing here deploys, so
# there is no half-released state to protect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # NOTE: keep only values usable in step/run/with contexts here. The `env`
  # context does not exist when service containers are provisioned, so service
  # image/ports/options/env must stay literal (centralizing them broke CI with
  # a 0s workflow-level failure).

jobs:
  # ===========================================================================
  # Frontend checks
  # ===========================================================================
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: FE/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # This job used to skip tests, so the FE unit suite ran nowhere.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ===========================================================================
  # Admin checks
  # ===========================================================================
  admin:
    name: Admin checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Next 16 generates `LayoutProps`/`PageProps` types into `.next/types/`.
      # A clean checkout lacks that directory, so `tsc` reports TS2304 unless
      # typegen runs first.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  # ===========================================================================
  # Backend checks
  # ===========================================================================
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The e2e suites need a real Postgres. Never the Neon production database:
    # tests write into it for real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gocode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # SMTP catcher for the integration suite (`be/test/*.integration.ts`
      # sends real mail through `AuthMailer` into Mailpit). Defaults: SMTP :1025
      # with no auth and no TLS, read API on :8025. Lightweight image, instant boot.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gocode
      # Point the real mailer at Mailpit instead of Brevo (see
      # `AuthMailer.readConfig`: a set `SMTP_HOST` selects the plaintext local
      # branch). `MAIL_FROM` stays required, same as production — Mailpit
      # accepts any address.
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: no-reply@gocode.local
    defaults:
      run:
        working-directory: be
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: be/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      # `test:cov` is `test` plus coverage measurement — one run instead of two,
      # so the thresholds in `vitest.config.ts` (lines 80 / branches 75) are
      # enforced for real without slowing CI down. See `be/vitest.config.ts`.
      - name: Test
        run: pnpm test:cov

      # Migrations must create every table before seeds/tests touch the DB.
      # The API e2e spec generates its own RSA keypair in-process, so no
      # ADMIN_JWT_* is needed here.
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed problems
        run: node scripts/seed-problems.ts

      # Not Playwright. `be/package.json` declares `test:e2e` as
      # `guard-e2e-db.mjs && vitest run --config ./vitest.config.e2e.ts` — the
      # NestJS HTTP suite (supertest against a real app), no browser involved.
      # Playwright lives in repo-root `e2e/` and gets its own job below. This
      # job used to run `npx playwright install` even though `be` has no
      # Playwright dependency: browsers downloaded for nobody, while the 40+
      # real browser tests never ran.
      - name: Test (API e2e)
        run: pnpm test:e2e

      # Integration (real DB): real services + real Postgres, real SMTP into
      # Mailpit (`be/test/*.integration.ts`). Runs after the API e2e; specs
      # truncate and clean up their own auth tables (User, UserToken,
      # ActivityDay, …), so they never clash with seeded data.
      # `DATABASE_URL` comes from the job env; `guard-e2e-db.mjs` refuses to
      # point at Neon by accident.
      - name: Test (integration)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  # ===========================================================================
  # Playwright e2e
  # ===========================================================================
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Service containers can't be shared between jobs, so Postgres is declared
    # again exactly like the `backend` job (same image, same health check).
    # A real Postgres in a container — never the Neon production database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gocode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # BOTH variables must point at the same database. The app reads
      # `DATABASE_URL` (pool), Prisma clients/tests read `DATABASE_URL_UNPOOLED`;
      # one missing or pointing elsewhere means app and tests talk to two
      # different databases — which once caused 13 false-red tests.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gocode
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/gocode
      # FE has no committed `.env`, so the API base URL is provided here. The
      # ports are load-bearing: specs intercept routes at `http://localhost:4000`,
      # and CORS assertions expect `Access-Control-Allow-Origin: http://localhost:3000`.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      DISABLE_RATE_LIMIT: '1'
      USE_DATABASE_TEST: '10'
      # Real Judge0 grades the submit test: without it, `POST :slug/submit`
      # throws 502 (nothing on localhost:2358) and Playwright times out waiting
      # for the 201 response. Both secrets come from repo Settings → Secrets.
      JUDGE0_URL: ${{ secrets.JUDGE0_URL }}
      JUDGE0_API_TOKEN: ${{ secrets.JUDGE0_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # Three independent installs with three separate lockfiles
          # (there is no pnpm-workspace.yaml).
          cache-dependency-path: |
            pnpm-lock.yaml
            be/pnpm-lock.yaml
            FE/pnpm-lock.yaml

      # `@playwright/test` lives in the root package, so root needs its own
      # node_modules.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: be
        run: pnpm install --frozen-lockfile

      # The `webServer` entry in `playwright.config.ts` runs `pnpm --dir FE dev`,
      # so FE must be installed first — otherwise the job dies inside the
      # Playwright step instead of the install step, which is harder to read.
      - name: Install frontend dependencies
        working-directory: FE
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        working-directory: be
        run: pnpm exec prisma migrate deploy

      - name: Seed problems
        working-directory: be
        run: node scripts/seed-problems.ts

      - name: Seed users
        working-directory: be
        run: node scripts/seed-users.ts

      # The real server signs access tokens with `ADMIN_JWT_PRIVATE_KEY`
      # (`be/src/auth/tokens.ts` — missing it turns `POST /api/auth/login` into
      # a 500 and Playwright fails inside `signIn`). The BE e2e suite generates
      # its own keypair in-process, but this server needs one from the env.
      # Generated fresh per run and written to `$GITHUB_ENV` for the backend
      # start below: keys live for one job, tokens expire in 15 minutes, so no
      # long-lived secret is required.
      - name: Generate ephemeral JWT keys
        working-directory: be
        run: node scripts/gen-ci-jwt-keys.mjs >> "$GITHUB_ENV"

      # The backend runs for real because specs need real data: `/problem`
      # server-renders from `GET /api/problems`, and `vip-problems.spec.ts`
      # needs a real 403 `problem_vip_only` for guests — the actual proof the
      # VIP policy runs. `main.ts` reads `process.env.PORT ?? 4000`, so the
      # port is pinned here. No step-level `env:`: the backend intentionally
      # inherits the job env (DATABASE_URL → `gocode`, same DB as migrate/seed
      # above). Pinning another URL here would split BE and seed data across
      # two databases.
      - name: Start backend
        working-directory: be
        run: |
          nohup pnpm start > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "started backend, log: $RUNNER_TEMP/backend.log"

      # Wait until the BE truly answers, not just "port is open": this endpoint
      # goes through Prisma, so it also proves migrations + seeds completed.
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:4000/api/problems?limit=1" > /dev/null; then
              echo "backend ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not start within 300s"
          tail -n 80 "$RUNNER_TEMP/backend.log" || true
          exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `next dev` reads `PORT` (`.default(3000).env('PORT')`), so the FE port is
      # pinned here. It must match `baseURL` + `webServer.url` in
      # `playwright.config.ts` and the `ORIGIN_FE` that `vip-problems.spec.ts`
      # asserts for CORS. `reuseExistingServer: !process.env.CI` lets Playwright
      # boot FE itself in CI — never start a second `next dev` here or the two
      # servers fight over port 3000.
      - name: Test (Playwright)
        env:
          PORT: '3000'
          PLAYWRIGHT_HTML_OPEN: 'never'
        run: pnpm exec playwright test --reporter="line,html" --trace=retain-on-failure

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ===========================================================================
  # Notify — Telegram build summary (always runs)
  # ===========================================================================
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, admin, backend, playwright]
    if: always()
    steps:
      - name: Check results
        id: check
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.admin.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Send Success Message
        if: steps.check.outputs.status == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="✅ CI/CD SUCCESS%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0AAuthor: ${{ github.actor }}%0ALink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Failure Message
        if: steps.check.outputs.status == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="❌ CI/CD FAILED%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0AAuthor: ${{ github.actor }}%0ALink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
