# SonarQube/SonarCloud configuration. Analyzed by the `sonar` job in
# `.github/workflows/main.yml` (SonarSource/sonarqube-scan-action).
#
# First-time setup (SonarCloud, free for public repos):
#   1. SonarCloud → + → Analyze new project → import longdrache/coding-dev-lab
#   2. Note the Organization key below (TODO) and project key
#   3. My Account → Security → Generate Token → save as repo secret SONAR_TOKEN
# Self-hosted SonarQube instead: set SONAR_HOST_URL secret/env in the workflow
# and point the scanner at it (see main.yml comment).

sonar.projectKey=longdrache_coding-dev-lab
sonar.organization=Dinh Long
sonar.projectName=GoCode
sonar.sourceEncoding=UTF-8

# Analyzed sources. admin/ has no tests yet — included for SAST, excluded
# from coverage (nothing produces its lcov).
sonar.sources=be/src,FE/app,FE/lib,FE/components,admin/app,admin/lib,admin/components
sonar.tests=be/src,be/test,FE/app,FE/lib,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.integration.ts,**/*.e2e-spec.ts,e2e/**/*.ts

# Never score these as coverable code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,be/src/generated/**,be/prisma/**,**/*.d.ts
sonar.coverage.exclusions=be/src/generated/**,**/*.d.ts,**/layout.tsx,**/loading.tsx,**/not-found.tsx,**/error.tsx

# Produced by `pnpm --dir be test:cov` and FE `vitest run --coverage` in CI,
# uploaded as the `coverage` artifact that the sonar job downloads.
sonar.javascript.lcov.reportPaths=be/coverage/lcov.info,FE/coverage/lcov.info
